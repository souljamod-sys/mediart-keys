name: Build Mediart APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          chmod +x gradlew || echo "no wrapper"
          if [ -f "./gradlew" ]; then./gradlew assembleDebug; else gradle wrapper &&./gradlew assembleDebug; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MediartKeys-APK
          path: app/build/outputs/apk/debug/app-debug.apk
